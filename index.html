<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM 聚合控制台</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app" id="app">
    <!-- 顶部栏 -->
    <header class="topbar">
      <button class="toggle-btn" id="toggleSidebar" title="折叠/展开侧边栏">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <span class="topbar-title">LLM 聚合控制台</span>
      <span class="proxy-status" id="proxyStatus" title="点击切换代理模式"></span>
      <button class="add-btn" id="openAddModal" title="添加新模型">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        添加模型
      </button>
    </header>

    <!-- 主体区域：侧边栏 + 主内容 -->
    <div class="app-body">
      <!-- 侧边栏 -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-search">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.4"/>
            <path d="M10 10l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <input type="text" id="searchInput" placeholder="搜索模型…" />
        </div>
        <nav class="nav-list" id="navList">
          <!-- 动态生成 -->
        </nav>
        <div class="sidebar-footer">
          <span id="modelCount">0 个模型</span>
        </div>
      </aside>

      <!-- 主内容区 -->
      <main class="main-content" id="mainContent">
        <div class="iframe-wrapper" id="iframeWrapper">
          <div class="empty-state" id="emptyState">
            <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
              <rect x="8" y="12" width="48" height="36" rx="4" stroke="currentColor" stroke-width="2"/>
              <path d="M24 52h16M32 48v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <h2>选择一个模型开始对话</h2>
            <p>从左侧列表选择一个 LLM，或点击「添加模型」添加新的地址</p>
          </div>
          <iframe id="contentFrame" src="" frameborder="0" allowfullscreen></iframe>
          <!-- 登录提示条 -->
          <div class="login-hint" id="loginHint" style="display:none;">
            <span>⚠️ 该网站需要登录，请在新窗口中完成登录</span>
            <button id="openNewTab">在新窗口打开</button>
            <button id="closeHint">×</button>
          </div>
          <!-- iframe 无法嵌入时的提示 -->
          <div class="iframe-blocked" id="iframeBlocked" style="display:none;">
            <div class="blocked-content">
              <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="2"/>
                <path d="M16 16l16 16M32 16l-16 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
              <h3>该网站不支持 iframe 嵌入</h3>
              <p>请点击下方按钮在新窗口中打开</p>
              <button id="openInNewTab" class="btn-open-new">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                  <path d="M12 2h2v2M12 2L6 8M6 14H3a1 1 0 01-1-1V5a1 1 0 011-1h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                在新窗口打开
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- 添加/编辑模型弹窗 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">添加新模型</h3>
        <button class="modal-close" id="closeModal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="modelName">模型名称</label>
          <input type="text" id="modelName" placeholder="例如：DeepSeek" />
        </div>
        <div class="form-group">
          <label for="modelUrl">网址 (URL)</label>
          <input type="url" id="modelUrl" placeholder="https://chat.deepseek.com" />
          <span class="hint">需要支持 iframe 嵌入的网站才能正常显示</span>
        </div>
        <div class="form-group">
          <label for="modelIcon">图标 (Emoji 或字母)</label>
          <input type="text" id="modelIcon" placeholder="🤖" maxlength="4" />
        </div>
        <div class="form-group">
          <label for="modelNewWindow">
            <input type="checkbox" id="modelNewWindow" />
            强制在新窗口打开（不适合 iframe 嵌入的网站）
          </label>
          <span class="hint">勾选后点击模型将直接在新标签页打开，不尝试 iframe 嵌入</span>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="cancelAdd">取消</button>
        <button class="btn-confirm" id="confirmAdd">添加</button>
      </div>
    </div>
  </div>

  <!-- 确认删除弹窗 -->
  <div class="modal-overlay" id="deleteModalOverlay">
    <div class="modal" style="width: 320px;">
      <div class="modal-header">
        <h3>确认删除</h3>
        <button class="modal-close" id="closeDeleteModal">&times;</button>
      </div>
      <div class="modal-body">
        <p style="color: var(--text-secondary); font-size: 14px; line-height: 1.6;">
          确定要删除 <strong id="deleteModelName"></strong> 吗？
        </p>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="cancelDelete">取消</button>
        <button class="btn-confirm" style="background: #ef4444; border-color: #ef4444;" id="confirmDelete">删除</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
